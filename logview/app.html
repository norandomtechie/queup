<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueUp Logview</title>
<style>
:root {
  color-scheme: light;
  --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.05);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --off:#c3c2b7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --off:#383835;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --off:#383835;
}
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { padding:0 16px 60px; }
main { max-width:1180px; margin:0 auto; }
a { color:var(--s1); }
h1 { font-size:22px; font-weight:600; margin:0; }
h2 { font-size:16px; font-weight:600; margin:0 0 4px; }
.sub { color:var(--ink2); font-size:13px; margin:0 0 12px; }
header.top { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; padding:18px 0 8px; }
.controls { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
label.ctl { display:flex; gap:6px; align-items:center; color:var(--ink2); font-size:13px; }
select, input[type=text], input[type=number], button {
  font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--border);
  border-radius:6px; padding:5px 8px; }
button { cursor:pointer; }
button:hover { background:var(--wash); }
button.on, .chip.on { background:var(--wash); border-color:var(--ink2); }
.chip { cursor:pointer; user-select:none; border:1px solid var(--border); border-radius:999px; padding:3px 11px; font-size:13px; background:var(--surface); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin:14px 0; }
.grid { display:grid; gap:12px; }
.g-kpi { grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
.g-sup { grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); }
.g-2 { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); }
.tile { background:var(--bg); border-radius:8px; padding:10px 12px; min-width:0; }
.tile .k { color:var(--ink2); font-size:12px; }
.tile .v { font-size:24px; font-weight:600; line-height:1.2; margin-top:2px; }
.tile .d { color:var(--ink2); font-size:12px; margin-top:4px; overflow-wrap:anywhere; }
.row { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin:6px 0 10px; }
.legend { display:flex; flex-wrap:wrap; gap:4px 14px; margin:8px 0 0; font-size:13px; color:var(--ink2); }
.legend i { display:inline-block; width:12px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }
.chip .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
.legend .chip { color:var(--ink); } .legend .chip:not(.on) { opacity:.5; text-decoration:line-through; }
.legend i.sq { height:10px; width:10px; border-radius:2px; }
.chart { position:relative; width:100%; }
.chart svg { display:block; width:100%; overflow:visible; }
.chart text { fill:var(--muted); font-size:11px; }
.chart .ytitle { fill:var(--ink2); }
#tip { position:fixed; pointer-events:none; z-index:9; background:var(--surface); color:var(--ink);
  border:1px solid var(--axis); border-radius:6px; padding:6px 9px; font-size:12px; display:none; max-width:300px;
  box-shadow:0 2px 10px rgba(0,0,0,.18); }
#tip b { font-weight:600; }
#tip .sw { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; }
.tablewrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { text-align:right; padding:5px 9px; border-bottom:1px solid var(--grid); white-space:nowrap; }
th:first-child, td:first-child { text-align:left; }
th { color:var(--ink2); font-weight:600; position:sticky; top:0; background:var(--surface); }
th.sortable { cursor:pointer; }
td.l, th.l { text-align:left; }
td.sub { max-width:240px; overflow:hidden; text-overflow:ellipsis; }
tr.thin td { color:var(--muted); }
tr.total td { font-weight:600; }
.stack { display:flex; gap:2px; height:22px; margin:8px 0 6px; }
.stack div { min-width:2px; border-radius:3px; }
.muted { color:var(--muted); }
.note { color:var(--ink2); font-size:12px; margin-top:6px; }
.err { background:var(--surface); border:1px solid var(--s8); border-radius:8px; padding:12px; margin:16px 0; }
.names-hidden .pii { filter:blur(5px); }
.heatcell { cursor:default; }
.skeleton { color:var(--muted); padding:30px 0; text-align:center; }
@media (max-width:560px) { .tile .v { font-size:20px; } body { padding:0 10px 40px; } }
</style>
</head>
<body>
<main>
<header class="top">
  <div>
    <h1 id="title">QueUp Logview</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="controls">
    <label class="ctl" title="Queue entries open longer than this are treated as forgotten and left out of all statistics">
      Stale cap <select id="cap"></select></label>
    <label class="ctl"><input type="checkbox" id="hide"> Hide usernames</label>
    <button id="theme" title="Cycle theme: auto / light / dark">Theme: auto</button>
  </div>
</header>
<div id="app"><div class="skeleton">Loading…</div></div>
</main>
<div id="tip"></div>

<script>
/*LV_CONFIG*/
</script>
<script>
"use strict";
if (!window.LV) window.LV = {user: "?", admin: false, room: "", cap: 4, defaultCap: 4};
const NS = "http://www.w3.org/2000/svg";
const $ = (s, el) => (el || document).querySelector(s);
const SER = i => "var(--s" + (i + 1) + ")";
const TERMS = ["Spring", "Summer", "Fall"];

// ---------- helpers -------------------------------------------------------------
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.className = attrs[k];
    else if (k === "on") for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]);
    else if (k === "style") e.style.cssText = attrs[k];
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
function svg(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function dur(s) {
  if (s == null || isNaN(s)) return "–";
  if (s < 1) return s.toFixed(2) + "s";
  let t = Math.round(s);
  if (t < 60) return t + "s";
  if (t < 3600) return Math.floor(t / 60) + "m " + String(t % 60).padStart(2, "0") + "s";
  const hh = Math.floor(t / 3600), mm = Math.round((t % 3600) / 60);
  return mm === 60 ? (hh + 1) + "h 00m" : hh + "h " + String(mm).padStart(2, "0") + "m";
}
function durShort(s) {
  if (s === 0) return "0";
  if (s < 60) return +s.toFixed(1) + "s";
  if (s < 3600) return +(s / 60).toFixed(1) + "m";
  return +(s / 3600).toFixed(1) + "h";
}
const num = n => n == null ? "–" : Math.round(n).toLocaleString();
const pct = (a, b) => b ? (100 * a / b).toFixed(1) + "%" : "–";
const sv = (st, k) => st ? st[k] : null;
function fmtDate(ts) {
  if (ts == null) return "–";
  return new Date(ts * 1000).toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric", timeZone: "America/Indiana/Indianapolis"});
}
function fmtIso(iso) { return dayLabel(dayNum(iso)); }
function dayNum(iso) { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; }
function dayLabel(n) { return new Date(n * 864e5).toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric", timeZone: "UTC"}); }
function niceTicks(max, n) {
  if (!(max > 0)) return [0, 1];
  const raw = max / (n || 5), p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p, t = [];
  for (let v = 0; v <= max + step * 0.999; v += step) t.push(+v.toFixed(10));
  return t;
}
const DSTEPS = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400, 21600, 43200, 86400, 172800];
function durTicks(max, n) {
  if (!(max > 0)) return [0, 1];
  const raw = max / (n || 5);
  const step = DSTEPS.find(x => x >= raw) || DSTEPS[DSTEPS.length - 1], t = [];
  for (let v = 0; v <= max + step * 0.999; v += step) t.push(v);
  return t;
}

// ---------- tooltip + redraw registry ----------------------------------------------
const tip = $("#tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, hgt = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 6) x = ev.clientX - w - 14;
  if (y + hgt > innerHeight - 6) y = ev.clientY - hgt - 14;
  tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
// chart redraw callbacks: RS = scope-dependent charts, RU = the rest; reg() adds to `target`
let RS = [], RU = [], target = RU;
const redrawAll = () => RS.concat(RU).forEach(f => f());
function reg(fn) { target.push(fn); fn(); }
const regS = fn => { RS.push(fn); fn(); };
const regU = fn => { RU.push(fn); fn(); };
let rzTimer;
addEventListener("resize", () => { clearTimeout(rzTimer); rzTimer = setTimeout(redrawAll, 120); });

// ---------- charts --------------------------------------------------------------
/* o: {series:[{name,color,pts:[{x,y}|{x,y:null}]}], kind:'line'|'bar', xFmt, yFmt, yTicks, xTicks, height, xTitle, yTitle, tipX} */
function xyChart(host, o) {
  host.innerHTML = "";
  const W = Math.max(300, host.clientWidth || 600), H = o.height || 270;
  const m = {l: 54, r: 14, t: 10, b: o.xTitle ? 44 : 30}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const all = o.series.flatMap(s => s.pts.filter(p => p.y != null));
  if (!all.length) { host.append(h("div", {class: "skeleton"}, "No data for this selection.")); return; }
  let xmin = Math.min(...all.map(p => p.x)), xmax = Math.max(...all.map(p => p.x));
  if (o.xDomain) [xmin, xmax] = o.xDomain;
  if (xmax === xmin) { xmin -= 1; xmax += 1; }
  if (o.kind === "bar") { const pad = (xmax - xmin) / o.series[0].pts.length / 2 + 0; xmin -= pad || .5; xmax += pad || .5; }
  const ymax0 = Math.max(...all.map(p => p.y));
  const yt = (o.dur ? durTicks : niceTicks)(ymax0 * 1.02, 5), ymax = yt[yt.length - 1];
  const X = x => m.l + (x - xmin) / (xmax - xmin) * iw, Y = y => m.t + ih - y / ymax * ih;
  const root = svg("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": o.title || "chart"}, host);
  yt.forEach(v => {
    svg("line", {x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v), stroke: "var(--grid)", "stroke-width": 1}, root);
    svg("text", {x: m.l - 7, y: Y(v) + 4, "text-anchor": "end"}, root).textContent = (o.yFmt || (o.dur ? durShort : num))(v);
  });
  svg("line", {x1: m.l, x2: m.l + iw, y1: Y(0), y2: Y(0), stroke: "var(--axis)", "stroke-width": 1}, root);
  const xt = o.xTicks || (() => { const k = Math.min(8, Math.floor(iw / 80)), t = []; for (let i = 0; i <= k; i++) t.push(Math.round(xmin + (xmax - xmin) * i / k)); return t; })();
  xt.forEach(v => svg("text", {x: X(v), y: H - m.b + 15, "text-anchor": "middle"}, root).textContent = (o.xFmt || String)(v));
  if (o.xTitle) svg("text", {x: m.l + iw / 2, y: H - 4, "text-anchor": "middle", class: "ytitle"}, root).textContent = o.xTitle;
  o.series.forEach(s => {
    if (o.kind === "bar") {
      const bw = Math.max(1, Math.min(o.barMax || 28, iw / (xmax - xmin) * (o.barW || 0.8)));
      s.pts.forEach(p => { if (p.y == null) return;
        const y = Y(p.y), ht = Math.max(0, Y(0) - y);
        svg("rect", {x: X(p.x) - bw / 2, y: y, width: bw, height: ht, fill: s.color, rx: bw > 6 ? 3 : 0}, root);
        if (o.barLabel) { // label inside the bar when it is big enough, otherwise just above it
          const inside = ht >= 20 && bw >= (o.narrow ? 22 : 30);
          svg("text", {x: X(p.x), y: inside ? y + 14 : y - 5, "text-anchor": "middle",
            style: inside ? "fill:#fff;font-size:11px;font-weight:600" : "fill:var(--ink2);font-size:11px"}, root).textContent = o.barLabel(p, o.narrow);
        }
      });
      return;
    }
    let d = "", pen = false;
    s.pts.forEach(p => { if (p.y == null) { pen = false; return; } d += (pen ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1); pen = true; });
    svg("path", {d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}, root);
    if (s.pts.length <= 40) s.pts.forEach(p => { if (p.y != null) svg("circle", {cx: X(p.x), cy: Y(p.y), r: 3.5, fill: s.color, stroke: "var(--surface)", "stroke-width": 2}, root); });
  });
  // hover layer
  const xs = [...new Set(all.map(p => p.x))].sort((a, b) => a - b);
  const cross = svg("line", {y1: m.t, y2: m.t + ih, stroke: "var(--ink2)", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden"}, root);
  const hit = svg("rect", {x: m.l, y: m.t, width: iw, height: ih, fill: "transparent"}, root);
  hit.addEventListener("mousemove", ev => {
    const r = root.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const xv = xmin + (px - m.l) / iw * (xmax - xmin);
    let best = xs[0]; for (const x of xs) if (Math.abs(x - xv) < Math.abs(best - xv)) best = x;
    cross.setAttribute("x1", X(best)); cross.setAttribute("x2", X(best)); cross.setAttribute("visibility", "visible");
    const rows = o.series.map(s => { const p = s.pts.find(q => q.x === best); return p && p.y != null ?
      `<div><span class="sw" style="background:${s.color}"></span>${esc(s.name)}: <b>${esc((o.tipY || o.yFmt || (o.dur ? dur : num))(p.y, p))}</b></div>` : ""; }).join("");
    showTip(`<div><b>${esc((o.tipX || o.xFmt || String)(best))}</b></div>${rows}`, ev);
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
}

function legend(items) {
  return h("div", {class: "legend"}, items.map(i => h("span", {}, h("i", {style: "background:" + i.color}), i.name)));
}

// sequential ramp (blue), one stop list per mode
const RAMP_L = ["#cde2fb", "#86b6ef", "#3987e5", "#1c5cab", "#0d366b"];
const RAMP_D = ["#0d366b", "#184f95", "#2a78d6", "#6da7ec", "#b7d3f6"];
function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); }
function ramp(t) {
  const dark = (document.documentElement.dataset.theme === "dark") ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const R = dark ? RAMP_D : RAMP_L, x = Math.max(0, Math.min(1, t)) * (R.length - 1), i = Math.min(R.length - 2, Math.floor(x)), f = x - i;
  const a = hex(R[i]), b = hex(R[i + 1]);
  return "rgb(" + a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(",") + ")";
}
function inkOn(t) { // readable cell text for a ramp position
  const dark = (document.documentElement.dataset.theme === "dark") || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  return dark ? (t > .6 ? "#0b0b0b" : "#fff") : (t > .45 ? "#fff" : "#0b0b0b");
}

const DOWS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const hr12 = h24 => (h24 % 12 || 12) + (h24 < 12 ? "a" : "p");
function heatmap(host, grid, o) { // grid[7][24] of numbers|null
  host.innerHTML = "";
  const W = Math.max(320, host.clientWidth || 700), m = {l: 36, t: 18, r: 4}, cw = (W - m.l - m.r) / 24, ch = Math.min(30, Math.max(22, cw * .8));
  const H = m.t + 7 * ch + 4, root = svg("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": o.title}, host);
  const vals = grid.flat().filter(v => v != null), max = Math.max(...vals, 0) || 1;
  for (let c = 0; c < 24; c += (cw < 22 ? 2 : 1)) svg("text", {x: m.l + c * cw + cw / 2, y: 12, "text-anchor": "middle"}, root).textContent = hr12(c);
  grid.forEach((row, r) => {
    svg("text", {x: m.l - 6, y: m.t + r * ch + ch / 2 + 4, "text-anchor": "end"}, root).textContent = DOWS[r];
    row.forEach((v, c) => {
      const t = v == null ? 0 : v / max;
      const rc = svg("rect", {x: m.l + c * cw + 1, y: m.t + r * ch + 1, width: cw - 2, height: ch - 2, rx: 3, fill: v == null ? "var(--wash)" : ramp(t), class: "heatcell"}, root);
      if (cw >= 26 && v != null && v > 0) svg("text", {x: m.l + c * cw + cw / 2, y: m.t + r * ch + ch / 2 + 4, "text-anchor": "middle", style: `fill:${inkOn(t)};font-size:10px`}, root).textContent = o.cell(v);
      rc.addEventListener("mousemove", ev => showTip(`<b>${DOWS[r]} ${hr12(c)}–${hr12((c + 1) % 24)}</b><div>${esc(o.tipLabel)}: <b>${esc(o.tip(v, r, c))}</b></div>`, ev));
      rc.addEventListener("mouseleave", hideTip);
    });
  });
}

// ---------- tables ----------------------------------------------------------------
/* cols: [{h, f(row)->text|node, cls, pii}] */
function table(cols, rows, o) {
  o = o || {};
  const t = h("table", {}, h("thead", {}, h("tr", {}, cols.map(c => h("th", {class: c.cls || ""}, c.h)))),
    h("tbody", {}, rows.map(r => h("tr", {class: (o.rowCls && o.rowCls(r)) || ""},
      cols.map(c => h("td", {class: (c.cls || "") + (c.pii ? " pii" : "")}, c.f(r)))))));
  return h("div", {class: "tablewrap"}, t);
}
const statCols = (get) => [
  {h: "Served", f: r => num(sv(get(r), "n"))},
  {h: "Min", f: r => dur(sv(get(r), "min"))},
  {h: "Avg", f: r => dur(sv(get(r), "mean"))},
  {h: "Std dev", f: r => dur(sv(get(r), "sd"))},
  {h: "Median", f: r => dur(sv(get(r), "median"))},
  {h: "p90", f: r => dur(sv(get(r), "p90"))},
  {h: "Max", f: r => dur(sv(get(r), "max"))},
];

// ---------- data ------------------------------------------------------------------
let CAP = LV.cap;
async function api(params) {
  const q = new URLSearchParams(Object.assign({cap: CAP}, params));
  const r = await fetch("?" + q.toString(), {credentials: "same-origin"});
  let j; try { j = await r.json(); } catch (e) { throw new Error("Server returned an unreadable response (" + r.status + ")."); }
  if (!r.ok || (j && j.error)) throw new Error((j && j.error) || ("HTTP " + r.status));
  return j;
}
function showError(e) { $("#app").replaceChildren(h("div", {class: "err"}, "Could not load data: " + e.message)); }

// ---------- single-room view ---------------------------------------------------------
let D = null, scope = "all";
const scopeObj = () => scope === "all" ? D.all : D.semesters.find(s => s.key === scope);
const scopeName = () => scope === "all" ? "all time" : scope;

async function openRoom(room) {
  $("#app").replaceChildren(h("div", {class: "skeleton"}, "Analyzing " + room + "… (first load of a big room can take a few seconds)"));
  try { D = await api({api: "room", room}); } catch (e) { return showError(e); }
  scope = "all";

  };
  mx.onchange = drawM;
  box.append(card("Room × semester matrix", "Darker = higher. Same metric for every room and semester.", h("div", {class: "row"}, h("label", {class: "ctl"}, "Metric ", mx)), mxBox));
  drawM();

  // hour-of-day profile + distribution
  const hp = h("div", {class: "chart"}), dd = h("div", {class: "chart"});
  const labels = ["<30s", "30s–1m", "1–2m", "2–5m", "5–10m", "10–20m", "20–30m", "30–60m", "1–2h", ">2h"];
  box.append(h("div", {class: "grid g-2"},
    card("When students show up", "Share of each room's joins by hour of day", h("div", {class: "row"}, legend(names)), hp),
    card("How long they wait", "Share of each room's sessions by wait-time bucket", dd)));
  reg(() => xyChart(hp, {series: data.map(d => { const tot = d.all.heat.joins.flat().reduce((a, b) => a + b, 0) || 1;
      return {name: d.room, color: col[d.room], pts: [...Array(24).keys()].map(hr => ({x: hr, y: 100 * d.all.heat.joins.reduce((a, r) => a + r[hr], 0) / tot}))}; }),
    xFmt: x => hr12(x), tipX: x => hr12(x) + "–" + hr12((x + 1) % 24), yFmt: v => +v.toFixed(1) + "%", height: 260, xTicks: [0, 3, 6, 9, 12, 15, 18, 21], title: "Joins by hour"}));
  reg(() => xyChart(dd, {series: data.map(d => { const tot = d.all.hist.reduce((a, b) => a + b, 0) || 1;
      return {name: d.room, color: col[d.room], pts: d.all.hist.map((v, i) => ({x: i, y: 100 * v / tot}))}; }),
    xFmt: i => labels[i], yFmt: v => +v.toFixed(1) + "%", height: 260, xTicks: labels.map((_, i) => i), title: "Wait distribution"}));
  box.scrollIntoView({behavior: "smooth", block: "start"});
}

// ---------- chrome ------------------------------------------------------------------
(function init() {
  const capSel = $("#cap");
  [1, 2, 4, 8, 12, 24, 72, 168].forEach(c => capSel.append(h("option", {value: c}, c + " h" + (c === LV.defaultCap ? " (default)" : ""))));
  if (![1, 2, 4, 8, 12, 24, 72, 168].includes(CAP)) capSel.append(h("option", {value: CAP}, CAP + " h"));
  capSel.value = CAP;
  capSel.onchange = () => { CAP = +capSel.value; LV.room ? openRoom(LV.room) : openOverview(); };
  const hide = $("#hide");
  hide.onchange = () => document.body.classList.toggle("names-hidden", hide.checked);
  const themeBtn = $("#theme"), modes = ["auto", "light", "dark"];
  let mode = "auto"; try { mode = localStorage.getItem("lv-theme") || "auto"; } catch (e) {}
  const apply = () => {
    if (mode === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = mode;
    themeBtn.textContent = "Theme: " + mode;
    try { localStorage.setItem("lv-theme", mode); } catch (e) {}
    redrawAll(); // heatmap colours depend on theme
  };
  themeBtn.onclick = () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; apply(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => redrawAll());
  apply();
  if (LV.room) openRoom(LV.room); else openOverview();
})();
</script>
</body>
