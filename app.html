                        // just signaling for this tab: no room state to render or relay
                        noteServerTime(json.servertime);
                        (json.signals || []).forEach(handleSignal);
                        return;
                    }
                    applyServerPayload(json, true);
                };
                window.evtSource.onerror = async () => {
                    // Starts the ping-backoff watchdog
                    if (!window.disableErrors) {
                        markConnectionLost();
                    }
                }
                // Pause the room's live connection after an hour without activity (see checkIdle)
                if (!window.lastActivity)
                    window.lastActivity = Date.now();
                // reopened on every reconnect/handoff: keep only one
                clearInterval(window.activityCheck);
                window.activityCheck = setInterval(checkIdle, 60 * 1000);
            }
            else {
                alert("This browser does not support Server-Sent Events, which is required to handle room functionality.  Use a more modern browser like Firefox or Chrome.");
            }
        }
        function genRoom(r, json) {
            // ### CHANGED: Updated Broadcast logic to use firstRun
            if (json.meta) {
                // Broadcast
                var bcast = json.meta.broadcast;

        function syncArr(_old, _new) {
            var actions = [];
            var diff = _new.filter(x => !_old.includes(x));
            var del = _old.filter(x => !_new.includes(x));
            del.forEach(i => {
                actions.push(['delete', i]);
                _old = _old.filter(x => x != i);
            });
            diff.forEach(i => {
                actions.push(['add', i]);
                _old.push(i);
            });
            _new.forEach((e,i) => {
                if (_old.indexOf(e) != i) {
                    actions.push(['shift', e, i]);
                }
            })
            return actions;
        }

        // Queue actions go to the server, or over the mesh during an outage or a 2s+ wait
        var SLOW_REQUEST_MS = 2000;
        function serverOrMesh(url, actionMsg, onResponse, onError) {
            actionMsg.id = crypto.randomUUID();
            actionMsg.t = Math.round(serverNow());
            if (shouldUseMeshRelay()) {
                relayAndApplyAction(actionMsg);
                window.disableOperations = false;
                return;
            }
            var relayed = false, answered = false;
            function relayInstead(failed) {
                if (relayed || !meshConnected()) return;
                relayed = true;
                // only a real failure means the server is down; a merely slow server just gets this one action relayed
                if (failed) confirmOutageNow();
                relayAndApplyAction(actionMsg);
                window.disableOperations = false;
            }
            var slowTimer = setTimeout(() => { if (!answered) relayInstead(false); }, SLOW_REQUEST_MS);
            fetchAndLimit(url + `&t=${actionMsg.t}&opid=${actionMsg.id}`, {meshFallback: true})
            .then(r => {
                answered = true;
                clearTimeout(slowTimer);
                if (r.status == 503) {
                    // never reached the server (or gave up waiting)
                    if (relayed) confirmOutageNow(); else relayInstead(true);
                    return;
                }
                // the server decided, so the mesh copy (if any) is redundant
                if (relayed) retractEnvelope(actionMsg.id);
                window.disableOperations = false;
                if (onResponse) return onResponse(r);
            })
            .catch(err => {
                answered = true;
                clearTimeout(slowTimer);
                if (window.signedOut && meshConnected()) {
                    // signed out: a peer can still sync this signed action for us
                    if (!relayed) { relayed = true; relayAndApplyAction(actionMsg); }
                    window.disableOperations = false;
                    return;
                }
                if (relayed) retractEnvelope(actionMsg.id);
                window.disableOperations = false;
                if (onError) onError(err);
            });
        }

                                <span class="switchCircle" id="outageSwitchCircle"></span>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="helpdiv row">${subtitle_p}</div>
            </div>`, 'text/html');
            var elm = newhtml.body.children[0];
            document.querySelector(`#rooms`).insertBefore(elm, document.querySelector("#queueadddiv"));
            if (window.is_owner) {
                document.querySelector(".roomsubtitle").addEventListener('blur', setRoomSubtitle);
                document.querySelector(".roomsubtitle").addEventListener('keydown', (event)=>{if(['Enter','Escape'].includes(event.key)){event.preventDefault();event.currentTarget.blur()}});
            }
        }
        function clearQueue(queue) {
            if (!window.is_owner) {
                alert("You are not authorized to clear this queue.  Unauthorized requests will be logged.");
                return;
            }
            ownerActionOrRelay(`roomd.wsgi/?setup=true&action=clear&room=${window.roomname}&queue=${queue}`,
                {action: "qclr", queue: queue});
        }
        function markOrDelUser(event, action='mark') {
            if (!window.is_owner) {
                alert("You are not authorized to perform this action.  Unauthorized requests will be logged.");
                return;
            }
            var queue = event.currentTarget.parentNode.parentNode.parentNode.id.slice(5);
            var username = event.currentTarget.parentNode.parentNode.querySelector("#username_text").innerHTML;
            if (action == 'mark') {
                // send a "mark" signal for this user.  if already marked, will be unmarked.
                // offline, send the mark as an absolute value so a replay can't flip it twice
                var entry = ((window.lastJSON && window.lastJSON[window.roomname] || {})[queue] || []).find(e => e[0] == username);
                ownerActionOrRelay(`roomd.wsgi/?setup=true&action=mark&room=${window.roomname}&queue=${queue}&username=${username}`,
                    {action: "qmrk", queue: queue, target: username, value: (entry && entry[3] == "1") ? "0" : "1"});
            }
            else {
                // delete user from queue. 
                performOp('del', queue, username);
            }
        }
        function addQueue(queue) {
            var parser = new DOMParser();
            var newhtml = parser.parseFromString(`<div style="width: 100%; display: flex; flex-direction: row; justify-content: space-between; align-items: center">
            <p title="Want to delete this queue?  Set the name to an empty string." class="queuetitle" ${window.is_owner ? "" : "style='cursor:default'"}" onblur="renameQueue(event)" onkeydown="if(['Enter','Escape'].includes(event.key)){event.preventDefault();event.currentTarget.blur()}" queue="${queue}" ${window.is_owner ? "contenteditable" : ""}>${queue}</p>
            ${window.is_owner ? ('<button class="btn clearbtn" style="display: flex;" onclick=\'clearQueue("' + queue + '")\'>Clear</button>') : ""}
            </div>
            <div id="queue${queue}" class="queue"></div>`, 'text/html');
            document.querySelector(".roomtop").appendChild(newhtml.body.children[0]);
            // JS madness - appendChild REMOVES THE CHILD FROM NEWHTML!
            document.querySelector(".roomtop").appendChild(newhtml.body.children[0]);
        }
        // for later theme changes
        function switchTheme() {
            // toggle from what's shown, so this still works without storage
            var dark = document.documentElement.getAttribute("theme") != "dark";
            prefSet("darkmode", dark ? "true" : "false");
            document.documentElement.setAttribute("theme", dark ? "dark" : "light");
        }
        async function toggleRoomLock() {
            try {
                var action = document.getElementById("toggleroomlock").innerHTML == "Lock Room" ? "lock" : "unlock";
                var response = await fetchAndLimit(`roomd.wsgi?setup=true&action=${action}&room=` + window.roomname);
                if (response.status != 200) {
                    alert("An error occurred while toggling the room lock.  Error: " + await response.text());
                    return;
                }
                else {
                    var locked = action == "lock";
                    window.roomlocked = locked;
                    alert("Successfully toggled room lock.  Room is now " + (locked ? "locked" : "unlocked") + ".  " +
                          "Users can " + (locked ? "no longer" : "now") + " add themselves to queues.");
                }
                document.getElementById("toggleroomlock").innerHTML = locked ? "Unlock Room" : "Lock Room";
            }
            catch(err) {
                alert("An error occurred while toggling the room lock: " + err.toString());
                console.error(err);
            }
        }
        async function modRoomOwners(action='add') {
            var owners = null;
            while (owners == null) {
                var owners = prompt("Enter a comma-separated list of usernames to " + (action == "add" ? "add as" : "delete from") + " room owners. (eg. user1, user2, user3)\n" + 
                                    "You can also enter an empty string to get the current list of owners.  Usernames must be in all small letters.");
                if (owners == null) {
                    return;
                }
                owners = owners.replace(/ /g, "");
                // mistake typing usernames
                try { owners = owners.split(","); }
                catch(err) { owners = null; }
                if (owners != "" && !/^[a-z0-9\-, /]{3,300}$/.test(owners.join(","))) {
                    alert("Usernames must be alphanumeric with optional hyphens, be more than 3 characters and less than 16 characters long.\nIf you were putting in a lot of people's usernames at once, consider splitting the list and trying again.");
                    owners = null;
                }
            }
            try {
                var _action = action == 'add' ? '' : 'del';
                var response = await fetchAndLimit(`roomd.wsgi?setup=true&action=${_action}own&room=` + window.roomname + '&newusers=' + owners.join(","));
                if (response.status != 200) {
                    alert("An error occurred while modifying the owner list.  Error: " + await response.text());
                    return;
                }
                else {
                    var newowners = await response.text();
                    newowners = newowners.replace(/"/g, "").replace(/'/g, "");
                    if (owners == "") {
                        alert("The current list of owners for this room is " + newowners + ".");
                    }
                    else {
                        alert("Successfully modified owner list.  List of owners for this room is: " + newowners + ".");
                    }
                }
            }
            catch(err) {
                alert("An error occurred while modifying owners: " + err.toString());
                console.error(err);
            }
        }
        // set up gear collapsible
        var gear = document.getElementById("gear");

        document.getElementById("createroom").addEventListener('keydown', (e) => {

        function copyUsername(event) {
            event.preventDefault();

        ///////////////////////////////////////////////////////////////
        // Mar 24 2025 - added a timer function for lab practicals
        function toggleTimerView() {
            var timerdiv = document.querySelector("#timer");
            if (timerdiv.style.display == "") {
                timerdiv.style.display = "flex";
            }
            else {
                timerdiv.style.display = "";
            }
        }
        function recurseTimer() {
            var now = Date.now();
            if (window.timerStopped) return;
            if (window.timerRunning == false) {
                window.lastSavedTimestamp = now;
                return;
            }
            // if timer is starting up
            if (window.timerStart === undefined)
                window.timerStart = now;
            if (window.lastSavedTimestamp !== undefined) {
                window.timerStart += (now - window.lastSavedTimestamp);
                delete window.lastSavedTimestamp;
            }
            else if (window.lastTimestamp === undefined)
                window.lastTimestamp = now;
            var elapsed = now - window.lastTimestamp;
            // if timer is done
            if ((now - window.timerStart) > window.timerLength) {
                changeTimer(0);
                setTimeout(() => {
                    resetTimer();
                }, 1000);
                return;
            }
            // otherwise wait (1 second - diff in time from start) to self-correct time
            else {
                now = Date.now()
                var curSecond = parseInt((now - window.timerStart) / 1000);
                var nextSecond = curSecond + 1;
                changeTimer(window.timerLength - (curSecond * 1000))
                window.lastTimestamp = now;
                setTimeout(recurseTimer, (nextSecond * 1000) - (now - window.timerStart));
                // setTimeout(recurseTimer, 1000);
            }
        }
        // thanks to Matt for saving my time
        // https://stackoverflow.com/questions/21294302/converting-milliseconds-to-minutes-and-seconds-with-javascript
        function msToTime(time) {
            var d = new Date (1000 * Math.round (time/1000));
            function pad(i) { return ('0'+i).slice(-2); }
            return d.getUTCHours() + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
        }
        function changeTimer(time) {
            document.querySelector("#timertext").innerHTML = msToTime(time);
        }
        window.timerLength = 120 * 60 * 1000;
        
        async function toggleTimerSync() {
            var op = window.timerSync ? "disable_sync" : "enable_sync";
            try {
                await fetchAndLimit(`roomd.wsgi?setup=true&action=timer&room=${window.roomname}&op=${op}`);
                // Visual updates happen via SSE
            } catch(e) { alert(e); }
        }

        async function sendBroadcast() {
            var msg = prompt("Enter the message to broadcast to all connected users:");
            if (msg && msg.trim() !== "") {
                try {
                    await fetchAndLimit(`roomd.wsgi?setup=true&action=broadcast&room=${window.roomname}&message=${encodeURIComponent(msg)}`);
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function handleSyncedTimer(data) {
            var btn = document.getElementById("synctimerbtn");
            var status = document.getElementById("timerstatus");
            var border = document.querySelector('#innertimer-border');
            var playBtn = document.querySelector('#stopstart');

            // Update Sync Button Text/State
            window.timerSync = data.sync;
            
            if (window.is_owner) {
                btn.innerHTML = data.sync ? "Disable timer sync" : "Enable timer sync";
                btn.style.borderColor = data.sync ? "var(--boilermaker-gold)" : "";
            } else {
                btn.style.display = "none"; // Non-owners can't toggle sync
            }

            if (data.sync) {
                status.style.display = "block";
                
                // Force the local timer to match server state
                window.timerLength = data.duration;
                
                if (data.running) {
                    // Calculate elapsed time
                    var now = Date.now(); // JS time is ms
                    var elapsed = now - data.start_time;
                    
                    // Set local state vars expected by recurseTimer
                    window.timerStart = data.start_time; 
                    window.timerRunning = true;
                    window.timerStopped = false;
                    
                    // Visuals
                    playBtn.innerHTML = "⏸";
                    border.classList.add('innertimer-border-active');
                    
                    // If we aren't already looping, kick it off
                    // (recurseTimer checks window.timerRunning)
                    recurseTimer(); 
                } else {
                    // Timer is paused/stopped on server
                    window.timerRunning = false;
                    window.timerStopped = true;
                    playBtn.innerHTML = "▶";
                    border.classList.remove('innertimer-border-active');
                    
                    // Show current remaining time
                    changeTimer(window.timerLength);
                }
            } else {
                status.style.display = "none";
                // If sync turned off remotely, we revert to local manual control
                // usually just leaving it in current state is fine
            }
        }

        function toggleTimer(event) {
            // New logic for sync
            if (window.timerSync && window.is_owner) {
                var op = window.timerRunning ? "stop" : "start";
                // Send current duration setting in case it changed
                fetchAndLimit(`roomd.wsgi?setup=true&action=timer&room=${window.roomname}&op=${op}&duration=${window.timerLength}`);
                return;
            } else if (!window.timerSync) {
                // Original logic
                var border = event.currentTarget.parentNode.parentNode.querySelector('#innertimer-border');
                if (event.currentTarget.innerHTML == "▶") {
                    border.classList.add('innertimer-border-active');
                    event.currentTarget.innerHTML = "⏸";
                    window.timerRunning = true;
                    window.timerStopped = false;
                    recurseTimer();
                }
                else if (event.currentTarget.innerHTML == "⏸") {
                    border.classList.remove('innertimer-border-active');
                    window.timerRunning = false;
                    event.currentTarget.innerHTML = "▶";
                }
            }
        }
        function resetTimer() {
            // New logic for sync
            if (window.timerSync && window.is_owner) {
                fetchAndLimit(`roomd.wsgi?setup=true&action=timer&room=${window.roomname}&op=reset&duration=${window.timerLength}`);
            } else if (!window.timerSync) {
                // Original logic
                var border = document.querySelector('#innertimer-border');
                border.classList.remove('innertimer-border-active');
                window.timerStopped = true;
                window.timerRunning = false;
                document.querySelector('#stopstart').innerHTML = "▶";
                document.querySelector("#timertext").innerHTML = msToTime(window.timerLength);
                delete window.timerStart;
                delete window.lastSavedTimestamp;
                delete window.lastTimestamp;
            }
        }

        function checkTime(event) {
            if (event.key == "Enter" || event.type == "blur") {
                event.currentTarget.innerHTML = event.currentTarget.innerHTML.replace(" ", "");
                if (event.currentTarget.innerHTML.match(/^(?:([0-9]+):)?(?:([0-9]+):)?([0-9]+)$/)) {
                    var hms = event.currentTarget.innerHTML.match(/^(?:([0-9]+):)(?:([0-9]+):)([0-9]+)$/);
                    var ms = event.currentTarget.innerHTML.match(/^(?:([0-9]+):)([0-9]+)$/);
                    var s = event.currentTarget.innerHTML.match(/^([0-9]+)$/);
                    if (hms) {
                        var hrs = hms[1]; var min = hms[2]; var sec = hms[3];
                        window.timerLength = (hrs * 60 * 60 * 1000) + (min * 60 * 1000) + (sec * 1000);
                    }
                    else if (ms) {
                        var min = ms[1]; var sec = ms[2];
                        window.timerLength = (min * 60 * 1000) + (sec * 1000);
                    }
                    else if (s) {
                        var sec = s[1];
                        window.timerLength = sec * 1000;
                    }
                }
                else {
                    event.currentTarget.innerHTML = "2:00:00";
                    window.timerLength = 120 * 60 * 1000;
                }
                resetTimer();
                event.currentTarget.blur();
            }
        }

        let notificationsEnabled = false;
        let currentSound = null;
        let previousQueueUsers = new Set(); // To track who is already in the queue
        const currentUsers = new Set();

        window.addEventListener('DOMContentLoaded', () => {

        function toggleNotifications() {
            const btn = document.getElementById('notify-toggle');
            const select = document.getElementById('sound-library');
            
            if (!notificationsEnabled) {
                // Request browser-level notification permissions
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        notificationsEnabled = true;
                        btn.innerHTML = '🔔';
                        select.style.display = 'inline-block';
                        prefSet('queup_notifications', 'true');

                        alert('Please allow browser notifications to use this feature.');
                    }
                });
            } else {
                notificationsEnabled = false;
                btn.innerHTML = '🔕';
                select.style.display = 'none';
                prefSet('queup_notifications', 'false');
            }
        }

        function changeSoundPreference() {
            const selected = document.getElementById('sound-library').value;
            currentSound = new Audio(selected);
            prefSet('queup_sound', selected);
            
            // Play a quick test sound so the user knows what they selected

        function triggerNotification(username, queueName) {
            if (!notificationsEnabled) return;

            // Play the selected sound
            if (currentSound) {
                currentSound.play().catch(e => console.log('Audio blocked by browser policy:', e));
            }
            
            // Show the desktop notification
            new Notification("New User in Queue", {
                body: `${username} just joined ${queueName}.`,
                icon: '/favicon.ico'
            });
        }
